<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Night Owl Book Store – Phase 1</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    
</head>
<body>

<!--
  =========================================
  NIGHT OWL BOOK STORE – PHASE 1
  World & Atmosphere (Exterior Only)
  -----------------------------------------
  Uses:
  - Three.js via CDN
  - OrbitControls
  - Procedural geometry & colors
  -----------------------------------------
  FUTURE VITE NOTE:
  Each section marked like this:
  👉 MOVE INTO /src/...
  =========================================
-->

<script type="module">
/* =========================================
   IMPORTS (CDN)
   ========================================= */

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================
   BASIC SCENE SETUP
   👉 MOVE INTO /src/scene/setup.js
   ========================================= */

const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 3, 12);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* =========================================
   CONTROLS (Orbit + Gentle Auto Movement)
   👉 MOVE INTO /src/controls/orbit.js
   ========================================= */

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 6;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI / 2.1;

/* =========================================
   LIGHTING (Soft Sunrise)
   👉 MOVE INTO /src/lighting/exterior.js
   ========================================= */

// Ambient light (soft fill)
scene.add(new THREE.AmbientLight(0xfff1dd, 0.9));

// Directional sunrise light
const sunLight = new THREE.DirectionalLight(0xffd7a3, 1.5);
sunLight.position.set(-5, 8, 5);
scene.add(sunLight);

/* =========================================
   SKY (Procedural Gradient)
   👉 MOVE INTO /src/environment/sky.js
   ========================================= */

const skyGeo = new THREE.SphereGeometry(200, 32, 32);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor: { value: new THREE.Color(0xf7596e) },   // warm sunrise pink
    bottomColor: { value: new THREE.Color(0xad59f7) } // soft peach / gold
  },
  vertexShader: `
    varying vec3 vWorldPosition;
    void main() {
      vec4 worldPosition = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPosition.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    varying vec3 vWorldPosition;
    void main() {
      float h = normalize(vWorldPosition).y * 0.5 + 0.5;
      gl_FragColor = vec4(mix(bottomColor, topColor, h), 1.0);
    }
  `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

/* =========================================
   CLOUDS (Slow Drift)
   👉 MOVE INTO /src/environment/clouds.js
   ========================================= */

const clouds = [];
const cloudMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.8
});

for (let i = 0; i < 6; i++) {
  const cloud = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 16, 16),
    cloudMat
  );
  cloud.position.set(
    -10 + i * 4,
    8 + Math.random(),
    -15
  );
  scene.add(cloud);
  clouds.push(cloud);
}

/* =========================================
   GROUND & STREET
   👉 MOVE INTO /src/environment/ground.js
   ========================================= */

// Street
const street = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 10),
  new THREE.MeshStandardMaterial({ color: 0x444444 })
);
street.rotation.x = -Math.PI / 2;
street.position.z = -2;
scene.add(street);

// Sidewalk
const sidewalk = new THREE.Mesh(
  new THREE.BoxGeometry(50, 0.2, 4),
  new THREE.MeshStandardMaterial({ color: 0x999999 })
);
sidewalk.position.set(0, 0.1, 3);
scene.add(sidewalk);

/* =========================================
   BOOKSTORE EXTERIOR
   👉 MOVE INTO /src/buildings/bookstore.js
   ========================================= */

const store = new THREE.Group();

// Brick foundation
const brickBase = new THREE.Mesh(
  new THREE.BoxGeometry(6, 1, 2),
  new THREE.MeshStandardMaterial({ color: 0x8b3a2e }) // warm red brick
);
brickBase.position.y = 0.5;
store.add(brickBase);

// Green storefront
const storefront = new THREE.Mesh(
  new THREE.BoxGeometry(6, 3, 1.5),
  new THREE.MeshStandardMaterial({ color: 0x2f5d50 }) // forest green
);
storefront.position.y = 1 + 1.5;
storefront.position.z = 0.25;
store.add(storefront);

// Large front window
const windowMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(3.5, 1.5),
  new THREE.MeshStandardMaterial({
    color: 0x222222,
    transparent: true,
    opacity: 0.5
  })
);
windowMesh.position.set(1.0, 3, 1.01); // move window to the right
windowMesh.scale.set(1, 1, 1); // adjust size if needed
windowMesh.position.y = 2; // slightly above brick
store.add(windowMesh);

scene.add(store);

/* ---------- Door ---------- */

// Door pivot group (IMPORTANT for rotation)
const doorPivot = new THREE.Group();

// Place pivot at hinge position: along the store facade, slightly above sidewalk
doorPivot.position.set(-2.5, 0, 1); // x, y, z hinge position
store.add(doorPivot);

// Door mesh
const door = new THREE.Mesh(
  new THREE.BoxGeometry(1.2, 2.5, 0.1), 
  new THREE.MeshStandardMaterial({ color: 0x6b3e26 })
);
door.position.set(0.6, 1.25, 0); // center the door on pivot vertically
// doorGlass.position.set(-0.6, 0.3, 0.06); // glass follows door // offset so it rotates correctly
doorPivot.add(door);

// Glass panel
const doorGlass = new THREE.Mesh(
  new THREE.PlaneGeometry(0.6, 0.9),
  new THREE.MeshStandardMaterial({
    color: 0x222222,
    transparent: true,
    opacity: 0.4
  })
);
doorGlass.position.set(0.6, 1.3, 0.06); // match door position
doorPivot.add(doorGlass);

// Store reference for raycasting
door.userData.isDoor = true;


/* =========================================
BOOKSTORE INTERIOR (Phase 2 – Simple)
👉 MOVE INTO /src/buildings/interior.js
========================================= */

/* Interior group inside the store */
const interior = new THREE.Group();
const axes = new THREE.AxesHelper(2);
interior.add(axes);

// Place interior behind storefront (negative z)
interior.position.z = -2.0; // adjust to fit inside the building
store.add(interior);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(5.5, 6),
  new THREE.MeshStandardMaterial({
    color: 0x3a2f2a,   // dark wood
    roughness: 0.8
  })
);

floor.rotation.x = -Math.PI / 2;
floor.position.y = 0.01; // avoid z-fighting
floor.position.z = 2.5;

interior.add(floor);

const wallMat = new THREE.MeshStandardMaterial({
  color: 0xf2e6d8, // warm plaster
  roughness: 0.9
});

// Back wall 
const backWall = new THREE.Mesh(
  new THREE.PlaneGeometry(5.5, 3),
  wallMat
);
backWall.position.set(0, 1.5, -3.0); // center relative to interior
backWall.rotation.y = Math.PI;     // face outward
interior.add(backWall);

// Left wall
const leftWall = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 3),
  wallMat
);
leftWall.rotation.y = Math.PI / 2; 
// move left wall back along z so it's fully inside
leftWall.position.set(-2.75, 1.5, -0.05); 
interior.add(leftWall);

// Right wall
const rightWall = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 3),
  wallMat
);
rightWall.rotation.y = -Math.PI / 2; 
// move right wall back along z
rightWall.position.set(2.75, 1.5, -0.05);
interior.add(rightWall);


function createShelf(x, z) {
  const shelf = new THREE.Group();

  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 2.2, 1.5),
    new THREE.MeshStandardMaterial({ color: 0x5a3e2b })
  );
  frame.position.y = 1.1;
  shelf.add(frame);

  // Books block (placeholder)
  const books = new THREE.Mesh(
    new THREE.BoxGeometry(0.25, 1.8, 1.3),
    new THREE.MeshStandardMaterial({ color: 0x8b5e3c })
  );
  books.position.set(0.05, 1.1, 0);
  shelf.add(books);

  shelf.position.set(x, 0, z);
  interior.add(shelf);
  shelf.rotation.y = Math.PI; // if they are mirrored

}

// Place shelves
createShelf(-2.1, -1.5);
createShelf(2.1, -1.5);

const interiorLight = new THREE.PointLight(0xffd2a6, 1.2, 10);
interiorLight.position.set(0, 2.5, 3);
interior.add(interiorLight);

// Soft fill so nothing goes black
interior.add(new THREE.AmbientLight(0xfff1dd, 0.4));



/* =========================================
   NEIGHBOR BUILDINGS (Simple)
   👉 MOVE INTO /src/buildings/neighbors.js
   ========================================= */

function createNeighbor(x, color) {
  const b = new THREE.Mesh(
    new THREE.BoxGeometry(4, 4, 2),
    new THREE.MeshStandardMaterial({ color })
  );
  b.position.set(x, 2, 0);
  scene.add(b);
}

createNeighbor(-5.5, 0x6f4e37); // coffee shop
createNeighbor(5.5, 0xb19cd9);  // yoga studio

/* =========================================
   TREES WITH WIND SWAY
   👉 MOVE INTO /src/environment/trees.js
   ========================================= */

const trees = [];

function createTree(x) {
  const tree = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.2, 2),
    new THREE.MeshStandardMaterial({ color: 0x5a3a1a })
  );
  trunk.position.y = 1;
  tree.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(0.9, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0x3b6b3b })
  );
  leaves.position.y = 2.3;
  tree.add(leaves);

  tree.position.set(x, 0, 4);
  scene.add(tree);
  trees.push(tree);
}

for (let i = -8; i <= 8; i += 4) {
  if (i === 0) continue; // skip tree in front of bookstore
  createTree(i);
}

/* =========================================
   GAS LAMP POST
   👉 MOVE INTO /src/props/lamp.js
   ========================================= */

const lamp = new THREE.Mesh(
  new THREE.CylinderGeometry(0.1, 0.1, 3),
  new THREE.MeshStandardMaterial({ color: 0x222222 })
);
lamp.position.set(-2.5, 1.5, 2.5);
scene.add(lamp);

/* =========================================
   INTERACTION (Raycasting)
   ========================================= */

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let doorOpen = false;
let enteringStore = false;

window.addEventListener('click', (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects([door], true);

  if (intersects.length > 0 && !doorOpen) {
    doorOpen = true;
    enteringStore = true;
  }
});

/* =========================================
   ANIMATION LOOP
   ========================================= */

let clock = new THREE.Clock();
const CAMERA_START_POS = new THREE.Vector3(0, 3, 12);
const CAMERA_INSIDE_POS = new THREE.Vector3(-1.5, 1.6, -1.2);
const CAMERA_INSIDE_TARGET = new THREE.Vector3(-2.5, 1.5, -6.5);


function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();

  // Gentle camera auto movement
  if (!enteringStore) {
  camera.position.x = Math.sin(t * 0.1) * 0.5;
}
  controls.update();

  // Cloud drift
  clouds.forEach(c => {
    c.position.x += 0.002;
    if (c.position.x > 12) c.position.x = -12;
  });

  // Tree sway
  trees.forEach(tree => {
    tree.rotation.z = Math.sin(t + tree.position.x) * 0.02;
  });

  if (doorOpen && doorPivot.rotation.y < Math.PI / 2) {
  // Rotate pivot postive to swing inward
  doorPivot.rotation.y += 0.02; 
}

// Smooth camera move into store
if (enteringStore) {
  controls.enabled = false;

  camera.position.lerp(CAMERA_INSIDE_POS, 0.02);
  controls.target.lerp(CAMERA_INSIDE_TARGET, 0.02);

  controls.update();

  if (camera.position.distanceTo(CAMERA_INSIDE_POS) < 0.05) {
    enteringStore = false;

    // Snap to final pose
    camera.position.copy(CAMERA_INSIDE_POS);
    controls.target.copy(CAMERA_INSIDE_TARGET);

    controls.update();
    controls.enabled = true;
  }
}


  renderer.render(scene, camera);
}

animate();

/* =========================================
   RESPONSIVE RESIZE
   ========================================= */

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>

<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>ML Favicon</title>
  <defs>
    <style>
      .shadow { fill: #26215C; }
      .card   { fill: #EEEDFE; stroke: #26215C; stroke-width: 2.5; }
      .letter { fill: #D4A5E8; stroke: #26215C; stroke-width: 2.5; stroke-linejoin: round; }
      .shine  { fill: rgba(255,255,255,0.6); }
      .gem    { stroke: #26215C; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- shadow -->
  <rect x="3" y="5" width="58" height="58" rx="14" class="shadow"/>
  <!-- card -->
  <rect x="0" y="2" width="58" height="58" rx="14" class="card"/>
  <!-- shine streak -->
  <rect x="3" y="4"  width="52" height="24" rx="12" class="shine"/>

  <!-- M compact -->
  <polygon points="6,54 6,16 14,16 23,32 32,16 40,16 40,54 32,54 32,30 23,44 14,30 14,54" class="letter"/>

  <!-- L compact -->
  <polygon points="43,16 51,16 51,46 58,46 58,54 43,54" class="letter"/>

  <!-- corner gems -->
  <circle cx="5"  cy="8"  r="4" fill="#D4A5E8" class="gem"/><ellipse cx="3.5" cy="6.5" rx="1.5" ry="1" class="shine"/>
  <circle cx="53" cy="8"  r="4" fill="#97ACFA" class="gem"/><ellipse cx="51.5" cy="6.5" rx="1.5" ry="1" class="shine"/>
  <circle cx="53" cy="56" r="4" fill="#F4C0D1" class="gem"/>
  <circle cx="5"  cy="56" r="4" fill="#AFA9EC" class="gem"/>

  <!-- sparkle -->
  <polygon points="46,12 47,15 50,15 48,17 49,20 46,18 43,20 44,17 42,15 45,15" fill="#7F77DD" opacity="0.8"/>
</svg>
